name: Authenticated preview

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: authenticated-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Authenticated preview (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:preview
      - name: Upload screenshots only (no browser state or raw logs)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: preview-screenshots
          path: test-results/preview/**/*.png
          if-no-files-found: ignore
          retention-days: 3
