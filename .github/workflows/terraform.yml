name: Terraform

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "scripts/**"
      - "packages/control-plane/**"
      - "packages/slack-bot/**"
      - "packages/github-bot/**"
      - "packages/linear-bot/**"
      - "packages/modal-infra/**"
      - "packages/daytona-infra/**"
      - "packages/opencomputer-infra/**"
      - "packages/e2b-infra/**"
      - "packages/sandbox-runtime/**"
      - "packages/sandbox-images/**"
      - "packages/vercel-infra/**"
      - "packages/shared/**"
      - "packages/web/**" # Web app deployed via Terraform when web_platform = "cloudflare"
      - ".github/workflows/terraform.yml"
      - ".github/workflows/terraform-run.yml"
      - ".nvmrc"
      - ".terraform-version"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "scripts/**"
      - "packages/control-plane/**"
      - "packages/slack-bot/**"
      - "packages/github-bot/**"
      - "packages/linear-bot/**"
      - "packages/modal-infra/**"
      - "packages/daytona-infra/**"
      - "packages/opencomputer-infra/**"
      - "packages/e2b-infra/**"
      - "packages/sandbox-runtime/**"
      - "packages/sandbox-images/**"
      - "packages/vercel-infra/**"
      - "packages/shared/**"
      - "packages/web/**"
      - ".github/workflows/terraform.yml"
      - ".github/workflows/terraform-run.yml"
      - ".nvmrc"
      - ".terraform-version"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false # Don't cancel terraform operations

env:
  TF_WORKING_DIR: terraform/environments/production

jobs:
  check-secrets:
    name: Check Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      has-secrets: ${{ steps.check.outputs.has-secrets }}
    steps:
      - name: Check if secrets are configured
        id: check
        run: |
          # Gate on every credential the plan and apply jobs consume to reach a
          # backend, not just two of them. A partial configuration used to report
          # has-secrets=true and then fail inside `terraform init` with an empty
          # access/secret key or an endpoint URL of "https://.r2.cloudflarestorage.com",
          # instead of skipping with the notice below. CLOUDFLARE_ACCOUNT_ID is read
          # with the same `vars || secrets` precedence the init steps use, so a
          # variable-configured deployment is not mistaken for an unconfigured one.
          account_id="${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}"
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] &&
            [ -n "${{ secrets.R2_ACCESS_KEY_ID }}" ] &&
            [ -n "${{ secrets.R2_SECRET_ACCESS_KEY }}" ] &&
            [ -n "$account_id" ]; then
            echo "has-secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has-secrets=false" >> $GITHUB_OUTPUT
            echo "::notice::Terraform plan/apply skipped - secrets not configured. See docs/GETTING_STARTED.md for setup instructions."
          fi

  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check-secrets]
    outputs:
      fmt: ${{ steps.fmt.outcome }}
      init: ${{ steps.init.outcome }}
      validate: ${{ steps.validate.outcome }}
      test: ${{ steps.test.outcome }}
      modal-test: ${{ steps.modal_test.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # See the same step in terraform-run.yml: /.terraform-version is the one
      # place the version is written, so validate cannot drift from the version
      # plan and apply run.
      - name: Read Terraform version
        id: tfversion
        run: printf 'version=%s\n' "$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tfversion.outputs.version }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform Init
        id: init
        run: |
          terraform init -backend=false
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: ${{ env.TF_WORKING_DIR }}

      # Unfiltered so a new tests/*.tftest.hcl file is gated the moment it lands;
      # naming each file here silently left new ones unrun.
      - name: Terraform Tests
        id: test
        run: terraform test
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Modal module contract tests
        id: modal_test
        run: |
          terraform init -backend=false
          terraform test
        working-directory: terraform/modules/modal-app

  plan:
    name: Plan
    needs: [validate, check-secrets]
    if: github.event_name == 'pull_request' && needs.check-secrets.outputs.has-secrets == 'true'
    uses: ./.github/workflows/terraform-run.yml
    secrets: inherit
    with:
      command: plan
      environment: production
      timeout_minutes: 15

  comment:
    name: Comment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate, check-secrets, plan]
    if: always() && !cancelled() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    # No checkout or execution of PR code. Artifacts are read only as comment data.
    steps:
      - name: Post Validation Results
        uses: actions/github-script@v9
        env:
          HAS_SECRETS: ${{ needs.check-secrets.outputs.has-secrets }}
          CHECK_SECRETS_RESULT: ${{ needs.check-secrets.result }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
          FORMAT_OUTCOME: ${{ needs.validate.outputs.fmt }}
          INIT_OUTCOME: ${{ needs.validate.outputs.init }}
          VALIDATE_OUTCOME: ${{ needs.validate.outputs.validate }}
          TEST_OUTCOME: ${{ needs.validate.outputs.test }}
          MODAL_TEST_OUTCOME: ${{ needs.validate.outputs.modal-test }}
        with:
          script: |
            const validationResult = process.env.VALIDATION_RESULT;
            const checkSecretsResult = process.env.CHECK_SECRETS_RESULT;
            const statuses = {
              Format: process.env.FORMAT_OUTCOME,
              Init: process.env.INIT_OUTCOME,
              Validate: process.env.VALIDATE_OUTCOME,
              Tests: process.env.TEST_OUTCOME,
              'Modal module tests': process.env.MODAL_TEST_OUTCOME
            };
            const rows = Object.entries(statuses).map(([step, outcome]) =>
              `| ${step} | ${outcome === 'success' ? 'Success' : outcome || (validationResult === 'skipped' ? 'skipped' : 'Not reported')} |`
            ).join('\n');
            let planNote = '';
            if (checkSecretsResult !== 'success') {
              planNote = '\n\n> **Warning:** Secret availability is unknown because the Check Secrets job did not succeed.';
            } else if (process.env.HAS_SECRETS === 'false') {
              planNote = '\n\n> **Note:** Terraform plan was skipped because secrets are not configured. This is expected for external contributors. See [docs/GETTING_STARTED.md](docs/GETTING_STARTED.md) for setup instructions.';
            } else if (process.env.HAS_SECRETS !== 'true') {
              planNote = '\n\n> **Warning:** Check Secrets completed without a valid secret-availability result.';
            }
            const output = `### Terraform Validation Results

            **Validation job:** ${validationResult || 'unknown'}
            **Check Secrets job:** ${checkSecretsResult || 'unknown'}

            | Step | Status |
            |------|--------|
            ${rows}
            ${planNote}

            *Pushed by: @${context.actor}, Action: \`${context.eventName}\`*`;

            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              });
            } catch (error) {
              if (error.status === 403) {
                core.notice('Could not post PR comment: GITHUB_TOKEN has read-only access (expected for fork PRs).');
              } else {
                throw error;
              }
            }

      - name: Download Plan Comment
        if: needs.plan.outputs.outcome == 'success' || needs.plan.outputs.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          name: terraform-plan-comment
          path: ${{ runner.temp }}/terraform-plan-comment

      - name: Post Plan Results
        if: needs.plan.outputs.outcome == 'success' || needs.plan.outputs.outcome == 'failure'
        uses: actions/github-script@v9
        env:
          PLAN_COMMENT_PATH: ${{ runner.temp }}/terraform-plan-comment/plan_comment.txt
        with:
          script: |
            const fs = require('node:fs');
            const body = fs.readFileSync(process.env.PLAN_COMMENT_PATH, 'utf8');
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            } catch (error) {
              if (error.status === 403) {
                core.notice('Could not post PR comment: GITHUB_TOKEN has read-only access (expected for fork PRs).');
              } else {
                throw error;
              }
            }

  apply:
    name: Apply
    needs: [validate, check-secrets]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.check-secrets.outputs.has-secrets == 'true'
    uses: ./.github/workflows/terraform-run.yml
    secrets: inherit
    with:
      command: apply
      environment: production

  # The gate that `Plan Status` used to be, moved out of the reusable workflow:
  # failing it there would make the called workflow fail, and a failed reusable
  # workflow's outputs do not reliably reach the caller, which the comment job
  # above depends on.
  plan-status:
    name: Plan Status
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [plan]
    if: always() && needs.plan.outputs.outcome == 'failure'
    steps:
      - run: exit 1
