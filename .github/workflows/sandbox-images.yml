name: Sandbox Images

on:
  pull_request:
    paths:
      - "packages/sandbox-images/**"
      - "packages/sandbox-runtime/**"
      - "packages/*-infra/**"
      - "terraform/modules/*/scripts/**"
      - "package-lock.json"
      - ".github/workflows/sandbox-images.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: e2b
            base: python:3.12-slim-bookworm
          - provider: vercel
            base: amazonlinux:2023
          - provider: daytona
            base: python:3.12-slim-bookworm
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.7"
      - name: Check frozen image inputs and planner regressions
        run: |
          python3 packages/sandbox-images/cli.py lock --check
          uv run --frozen --project packages/sandbox-images --extra dev pytest packages/sandbox-images/tests
      - name: Build and verify the reference image on native amd64
        run: |
          set -euo pipefail
          bundle=$(python3 packages/sandbox-images/cli.py pack --provider ${{ matrix.provider }})
          if [ "${{ matrix.provider }}" = daytona ]; then
            mapfile -t runtime_args < <(jq -r '.runtimeEnv | to_entries[] | "--build-arg", ("OI_ENV_" + (.key | ascii_upcase) + "=" + .value)' "$bundle/build-config.json")
            runtime_version=$(jq -r '.runtimeVersion' "$bundle/build-config.json")
            docker build --platform linux/amd64 --target daytona-runtime \
              --build-arg BASE_IMAGE=${{ matrix.base }} \
              --build-arg "SANDBOX_VERSION=$runtime_version" "${runtime_args[@]}" \
              -f "$bundle/packages/sandbox-images/Dockerfile" -t openinspect-image-contract "$bundle"
            docker image inspect openinspect-image-contract | jq -e --slurpfile plan "$bundle/build-config.json" '
              .[0].Config as $config |
              ($config.Env | map(capture("^(?<key>[^=]+)=(?<value>.*)$")) | from_entries) as $env |
              $config.Entrypoint == ["/opt/openinspect/python/bin/python", "-m", "sandbox_runtime.entrypoint"] and
              ($config.Cmd == null or $config.Cmd == []) and $config.WorkingDir == "/workspace" and
              $env.SANDBOX_VERSION == $plan[0].runtimeVersion and
              all($plan[0].runtimeEnv | to_entries[]; $env[.key] == .value)'
            docker run --rm --platform linux/amd64 \
              --entrypoint /opt/openinspect/python/bin/python \
              openinspect-image-contract /app/verify/smoke_test.py verify
          else
            docker build --platform linux/amd64 --build-arg BASE_IMAGE=${{ matrix.base }} \
              -f "$bundle/packages/sandbox-images/Dockerfile" -t openinspect-image-contract "$bundle"
            docker run --rm --platform linux/amd64 openinspect-image-contract
          fi
