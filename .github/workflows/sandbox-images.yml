name: Sandbox Images

on:
  pull_request:
    paths:
      - "packages/sandbox-images/**"
      - "packages/sandbox-runtime/**"
      - "packages/*-infra/**"
      - "terraform/modules/*/scripts/**"
      - "package-lock.json"
      - ".github/workflows/sandbox-images.yml"
      - ".nvmrc"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: e2b
            base: python:3.12-slim-bookworm
            runner: ubuntu-latest
            platform: linux/amd64
          - provider: vercel
            base: amazonlinux:2023
            runner: ubuntu-latest
            platform: linux/amd64
          - provider: opencomputer
            base: amazonlinux:2023
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.7"
      - name: Check frozen image inputs and planner regressions
        run: |
          python3 packages/sandbox-images/cli.py lock --check
          uv run --frozen --project packages/sandbox-images --extra dev pytest packages/sandbox-images/tests
      - name: Build and verify the reference image on native architecture
        run: |
          bundle=$(python3 packages/sandbox-images/cli.py pack --provider ${{ matrix.provider }})
          docker build --platform ${{ matrix.platform }} --build-arg BASE_IMAGE=${{ matrix.base }} -f packages/sandbox-images/Dockerfile -t openinspect-image-contract "$bundle"
          docker run --rm --platform ${{ matrix.platform }} openinspect-image-contract
