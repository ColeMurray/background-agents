name: Deploy Docs

# Docs publication is manual: a maintainer runs this workflow from the Actions
# tab after CI is green on main. It only runs for the main branch and deploys
# the commit at the tip of main when it starts.
on:
  workflow_dispatch:

permissions:
  contents: read

# Queue a second request behind an active deployment instead of cancelling it.
concurrency:
  group: deploy-docs-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy docs to Vercel
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check if docs deployment is configured
        id: check-secrets
        env:
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
        run: |
          missing=""
          [ -z "$VERCEL_API_TOKEN" ] && missing="$missing VERCEL_API_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_TEAM_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_DOCS_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "Skipping deployment - not configured:$missing"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: steps.check-secrets.outputs.configured == 'true'
        run: npm ci

      - name: Install Vercel CLI 58.4.0
        if: steps.check-secrets.outputs.configured == 'true'
        run: npm install -g vercel@58.4.0

      - name: Pull Vercel environment
        if: steps.check-secrets.outputs.configured == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_API_TOKEN }}

      - name: Build docs
        if: steps.check-secrets.outputs.configured == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_API_TOKEN }}

      - name: Deploy docs
        if: steps.check-secrets.outputs.configured == 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_API_TOKEN }}
