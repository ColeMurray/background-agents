name: Deploy Docs

# Production publication waits for the repository's own validation: this
# workflow runs only after "CI (TypeScript)" succeeds for a commit on main, and
# deploys that exact commit. `workflow_dispatch` remains for maintainers who
# need to republish a commit that CI already validated.
on:
  workflow_run:
    workflows: ["CI (TypeScript)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    name: Deploy docs to Vercel
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check if docs deployment is configured
        id: check-secrets
        env:
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
        run: |
          missing=""
          [ -z "$VERCEL_API_TOKEN" ] && missing="$missing VERCEL_API_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_TEAM_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_DOCS_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "Skipping deployment - not configured:$missing"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 2
          persist-credentials: false

      # CI runs for many changes that do not touch the docs site. Skip the
      # deploy when the validated commit changed nothing the docs build uses.
      - name: Check whether the docs site changed
        id: check-changes
        if: steps.check-secrets.outputs.configured == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1 && git diff --quiet HEAD^ HEAD -- \
              packages/docs package.json package-lock.json .github/workflows/deploy-docs.yml; then
            echo "Skipping deployment - the docs site did not change in $DEPLOY_SHA"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.check-secrets.outputs.configured == 'true' && steps.check-changes.outputs.changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: steps.check-secrets.outputs.configured == 'true' && steps.check-changes.outputs.changed == 'true'
        run: npm ci

      - name: Install Vercel CLI 58.4.0
        if: steps.check-secrets.outputs.configured == 'true' && steps.check-changes.outputs.changed == 'true'
        run: npm install -g vercel@58.4.0

      - name: Pull Vercel environment
        if: steps.check-secrets.outputs.configured == 'true' && steps.check-changes.outputs.changed == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_API_TOKEN }}

      - name: Build docs
        if: steps.check-secrets.outputs.configured == 'true' && steps.check-changes.outputs.changed == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_API_TOKEN }}

      - name: Deploy docs
        if: steps.check-secrets.outputs.configured == 'true' && steps.check-changes.outputs.changed == 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_API_TOKEN }}
