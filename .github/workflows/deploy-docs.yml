name: Deploy Docs

# Production publication waits for the repository's own validation: this
# workflow runs only after "CI (TypeScript)" succeeds for a push to this
# repository's main branch, and deploys that exact commit. CI also runs for
# pull requests, including forks whose branch may be named "main", so the job
# checks the triggering event and repository, not just the branch name.
# `workflow_dispatch` republishes the current main commit.
on:
  workflow_run:
    workflows: ["CI (TypeScript)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Queue deployments instead of cancelling an active one; each run deploys the
# commit CI validated, so the newest run always leaves production current.
concurrency:
  group: deploy-docs-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    name: Deploy docs to Vercel
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check if docs deployment is configured
        id: check-secrets
        env:
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
        run: |
          missing=""
          [ -z "$VERCEL_API_TOKEN" ] && missing="$missing VERCEL_API_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_TEAM_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_DOCS_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "Skipping deployment - not configured:$missing"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Setup Node.js
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: steps.check-secrets.outputs.configured == 'true'
        run: npm ci

      - name: Install Vercel CLI 58.4.0
        if: steps.check-secrets.outputs.configured == 'true'
        run: npm install -g vercel@58.4.0

      - name: Pull Vercel environment
        if: steps.check-secrets.outputs.configured == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_API_TOKEN }}

      - name: Build docs
        if: steps.check-secrets.outputs.configured == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_API_TOKEN }}

      - name: Deploy docs
        if: steps.check-secrets.outputs.configured == 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_API_TOKEN }}
