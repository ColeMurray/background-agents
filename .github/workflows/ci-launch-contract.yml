name: CI (Sandbox launch contract)

# Always report this check on PRs: either side, workflow, defaults, or a bundled
# runtime change can affect the contract. No provider or deployment credentials.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: launch-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:launch-contract
