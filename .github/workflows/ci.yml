name: CI (TypeScript)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".prettierignore"
      - ".prettierrc"
      - "eslint.config.js"
      - "knip.json"
      - "package-lock.json"
      - "package.json"
      - "packages/control-plane/**"
      - "packages/github-bot/**"
      - "packages/linear-bot/**"
      - "packages/opencomputer-infra/**"
      - "packages/sandbox-runtime/**"
      - "packages/shared/**"
      - "packages/slack-bot/**"
      - "packages/web/**"
      - "scripts/**"
      - "terraform/d1/migrations/**"
      - "vitest.workspace.ts"
      - "!**/*.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".prettierignore"
      - ".prettierrc"
      - "eslint.config.js"
      - "knip.json"
      - "package-lock.json"
      - "package.json"
      - "packages/control-plane/**"
      - "packages/github-bot/**"
      - "packages/linear-bot/**"
      - "packages/opencomputer-infra/**"
      - "packages/sandbox-runtime/**"
      - "packages/shared/**"
      - "packages/slack-bot/**"
      - "packages/web/**"
      - "scripts/**"
      - "terraform/d1/migrations/**"
      - "vitest.workspace.ts"
      - "!**/*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typescript:
    name: Lint & Format (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Minimum supported release: node:sqlite is available without an
          # additional flag and --experimental-transform-types is present.
          node-version: "22.13.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Test complexity reporter
        run: npm run test:lint-complexity

      - name: Test Owner bootstrap CLI
        run: npm run test:rbac-bootstrap-owner

      - name: Test user merge CLI
        run: npm run test:user-merge-cli

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Run Knip (unused code detection)
        run: npm run knip -- --no-exit-code

  typecheck-typescript:
    name: TypeCheck (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @open-inspect/shared

      - name: TypeCheck all packages
        run: npm run typecheck

  build-web:
    name: Build (Web)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @open-inspect/shared

      - name: Build web package
        run: npm run build -w @open-inspect/web

  test-cp-unit:
    name: Test (control-plane unit)
    runs-on: ubuntu-latest
    # The suite itself runs in under a minute; the budget is for a slow
    # dependency install, which has taken over four minutes on a warm cache.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @open-inspect/shared

      - name: Run shared tests
        run: npm test -w @open-inspect/shared

      - name: Run control-plane unit tests
        run: npm test -w @open-inspect/control-plane

  test-cp-integration:
    name: Test (control-plane integration ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @open-inspect/shared

      - name: Run control-plane integration tests
        run: npm run test:integration -w @open-inspect/control-plane -- --shard=${{ matrix.shard }}

  test-web:
    name: Test (web)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @open-inspect/shared

      - name: Run web tests
        run: npm test -w @open-inspect/web

  test-bots:
    name: Test (bots)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @open-inspect/shared

      - name: Run github-bot tests
        run: npm test -w @open-inspect/github-bot

      - name: Run slack-bot tests
        run: npm test -w @open-inspect/slack-bot

      - name: Run linear-bot tests
        run: npm test -w @open-inspect/linear-bot
