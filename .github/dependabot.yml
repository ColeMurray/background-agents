version: 2

# Scheduled version updates. Security updates are enabled separately in the
# repository settings and still cover every ecosystem, including the ones
# excluded here.
#
# Terraform providers and Docker base images are intentionally not scheduled:
# Dependabot PRs cannot run `terraform plan` (no production secrets) and merges
# to main auto-apply. Bump them manually from a regular branch.

updates:
  # npm — the root lockfile covers every packages/* workspace. The
  # sandbox-images/locks/* npm closures are pinned via toolchain.json and
  # intentionally excluded.
  - package-ecosystem: npm
    directory: /
    schedule:
      # Roughly every two weeks; Dependabot has no biweekly interval.
      interval: cron
      cronjob: "0 9 1,15 * *"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # One PR for all minor/patch bumps; majors still get their own.
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  # Python. sandbox-images/locks/python-tools is excluded: its uv.lock feeds the
  # hash-checked locks/python-tools.txt export that `sandbox:images lock` must
  # regenerate, and its pyproject.toml is generated from toolchain.json.
  # sandbox-runtime is not listed yet. Its requirements are exported from its
  # uv.lock at pack time, so a uv.lock-only bump no longer fails
  # `sandbox:images lock --check`; enabling it is a separate change. e2b-infra
  # and daytona-infra are excluded until PR CI installs and tests their locked
  # SDKs; Terraform consumes those lockfiles during apply.
  - package-ecosystem: uv
    directories:
      - /packages/modal-infra
      - /packages/sandbox-images
    # Scanning /packages/sandbox-images also finds locks/*.txt, and Dependabot
    # edits those exports as plain requirements files without their uv.lock.
    # exclude-paths covers version updates only: a security update can still
    # edit them, which `sandbox:images lock --check` fails in CI. Fix such PRs
    # by upgrading the source uv.lock and running `sandbox:images lock`.
    exclude-paths:
      - "locks/**"
    ignore:
      # Newer Modal releases remove the endpoint introspection modal-infra
      # tests use (Function.get_raw_f, .spec, .get_build_def). Bump it manually.
      # update-types applies to version updates only, so Modal security
      # updates still open PRs.
      - dependency-name: modal
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
