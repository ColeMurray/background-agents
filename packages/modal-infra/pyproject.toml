[project]
name = "open-inspect-modal"
version = "0.1.0"
description = "Modal sandbox infrastructure for Open-Inspect coding agent"
requires-python = ">=3.12"
dependencies = [
    "open-inspect-sandbox-runtime",  # sibling package, resolved via [tool.uv.sources]
    "modal>=1.4.3",  # Function.with_options() (per-call timeout override) requires >=1.4.3
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "fastapi>=0.110.0",
    "PyJWT[crypto]>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[tool.uv.sources]
open-inspect-sandbox-runtime = { path = "../sandbox-runtime", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
extend = "../../ruff.toml"
src = ["src", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["src", "sandbox_runtime"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["venv", ".venv", "tests"]
